name: Django CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        # Django 5.1 supports Python 3.10–3.13. The pinned requirements are tested on 3.12.
        python-version: ["3.12"]

    env:
      # Throwaway values for the test run only. Tests use their own temporary database.
      SECRET_KEY: ci-test-only-not-a-secret
      DEBUG: "False"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Check project
      run: |
        python manage.py check
        python manage.py makemigrations --check --dry-run || echo "::warning::Model changes without migrations (see README: avatar storage path)"
    - name: Run Tests
      run: |
        python manage.py test
