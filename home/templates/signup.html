{% extends 'auth_base.html' %}
{% load crispy_forms_tags %}
{% block title %}Create account{% endblock %}
{% block auth_content %}
<h2>Create an account</h2>
<p class="lead-sm">You'll sign in with your username after creating the account.</p>

<form method="post" action="{% url 'home:signup' %}" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary w-100 py-2">Create account</button>
</form>

<p class="auth-foot">Already have an account? <a href="{% url 'home:login' %}">Sign in</a></p>
{% endblock %}
