{% extends 'auth_base.html' %}
{% block title %}Logged out{% endblock %}
{% block auth_content %}
<div class="text-center">
    <span class="avatar avatar-lg mb-3 mx-auto" aria-hidden="true" style="width:64px;height:64px;font-size:1.4rem"><i class="fas fa-arrow-right-from-bracket"></i></span>
    <h2>You have been logged out</h2>
    <p class="lead-sm">Your session has ended. You can close this tab or sign in again.</p>
    <a href="{% url 'home:login' %}" class="btn btn-primary w-100 py-2">Return to sign in</a>
</div>
{% endblock %}
