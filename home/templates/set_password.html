{% extends 'auth_base.html' %}
{% load crispy_forms_tags %}
{% block title %}Set new password{% endblock %}
{% block auth_content %}
<p class="form-section-title">Step 3 of 3</p>
<h2>Set a new password</h2>
<p class="lead-sm">Use at least 8 characters, and avoid common or all-number passwords.</p>

<form method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-primary w-100 py-2" type="submit">Save password and sign in</button>
</form>
{% endblock %}
